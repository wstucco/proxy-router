# ── Global ─────────────────────────────────────────────────────────────────────
# Schema version (used for future migration support). Do not change.
version = "1"

# Address the proxy listens on. Configure your browser/OS/app to use this.
listen = "localhost:1337"

# ── Upstream proxies ───────────────────────────────────────────────────────────
# Named proxy definitions. Reference them by name from locations.
# Format: http://username:password@host:port
[proxies]
corp = "http://username:password@corp-proxy:8080"

# ── Named PAC scripts ─────────────────────────────────────────────────────────
# Optional section. Define PAC scripts here and reference them by name,
# instead of writing file paths or URLs inline.
# [pacs]
# corporate = "/etc/proxy-router/corporate.pac"
# auto = "http://proxy:8080/proxy.pac"

# ── Default behavior ───────────────────────────────────────────────────────────
# Used when no location matches the current connection.
# Exactly one of proxy or pac must be set (the other must be absent or "direct").
[defaults]
# "direct" to connect directly, or a proxy name from [proxies].
proxy = "direct"
# To use a PAC instead: pac = "corporate" (and leave proxy unset or "direct")
# Destinations that always bypass the proxy (merged with per-location no_proxy).
# Supports: wildcard "*", CIDR "10.0.0.0/8", domain ".internal", exact match.
no_proxy = []

# Routes in [defaults] apply regardless of which location matches.
# Location-specific routes override same-key defaults.
# See routes documentation below for syntax.
[defaults.routes]

# ── Office location ────────────────────────────────────────────────────────────
# Matches when the current Wi-Fi SSID OR destination IP falls in one of the
# defined ranges OR the destination hostname matches one of the domain suffixes.
# Matchers within a location are OR'd inside each array, AND'd across arrays.
#
# All traffic goes through the corp proxy, except internal domains which bypass it.
[locations.office]
proxy = "corp"
# NTLM authentication domain (omit if not using NTLM).
domain = "CORP"
# Match by Wi-Fi SSID (case-insensitive, supports "*" wildcard).
ssids = ["OfficeWifi", "OfficeWifi-5G"]
# Match by destination IP or CIDR range.
ips = ["10.0.0.0/8"]
# Match by hostname suffix (leading dot = subdomain).
domains = [".corp.internal"]
# Custom DNS servers used only for connections matching this location.
dns = ["10.0.0.1", "10.0.0.2"]
# Destinations to bypass the proxy for (merged with defaults.no_proxy).
no_proxy = [".internal.corp.com", "192.168.0.0/24"]

# ── Routes (destination rewriting) ────────────────────────────────────────────
# Routes rewrite requests matching host+path to a different URL, like a
# reverse proxy / API gateway. Unmatched requests use the location's proxy.
#
# Routes can be defined under a location (location-specific) or under [defaults]
# (apply everywhere). Location routes override defaults for the same key.
#
#   "www.repubblica.it" = "https://httpbin.org/"
#     → www.repubblica.it/{path} → httpbin.org/{path}
#
#   "repo1.maven.org/maven2/com/company/" = "https://nexus.internal/repo/"
#     → repo1.maven.org/maven2/com/company/foo/1.0/foo.pom
#       → nexus.internal/repo/foo/1.0/foo.pom
#
# HTTP routes work directly. HTTPS routes require TLS interception (MITM),
# enabled automatically when a location has routes defined. In MITM mode,
# requests still respect the location's upstream proxy setting, including
# routed requests, unless the destination matches no_proxy. The CA cert must be trusted:
# Route targets without an explicit scheme default to https/443; explicit http
# targets use port 80. Unsupported schemes are rejected.
#   proxy-router install-certs
#   sudo security add-trusted-cert -d -r trustRoot \
#     -k /Library/Keychains/System.keychain /opt/homebrew/etc/proxy-router/cacert.pem
[locations.office.routes]
# Route company Maven artifacts to the internal Nexus instead of Maven Central.
"repo1.maven.org/maven2/com/companyname/" = "https://nexus.company.com/repository/private/"
# Route httpbin to a local debug server.
"httpbin.org" = "https://localhost:4321"

# ── Home office location ──────────────────────────────────────────────────────
# Matches only on SSID. No IP or domain matchers — any destination matches.
# Uses the corp proxy when on this network.
[locations.home-office]
proxy = "corp"
ssids = ["home-office"]

# ── Internal domains (always via upstream) ─────────────────────────────────────
# Matches regardless of network — only domain matching is used.
# Without an SSID matcher, this location is always evaluated.
[locations.internal]
proxy = "corp"
domains = ["internal.corp.com", "jira.corp.com", "confluence.corp.com"]

# ── Hooks (on location enter/leave) ──────────────────────────────────────────
# Hooks execute shell commands when the active location changes (e.g. Wi-Fi
# network switch). Useful for side effects like connecting/disconnecting a VPN.
#
# The command is executed via "sh -c" (multi-line strings supported with """).
# Env vars: LOCATION, ACTION (enter/leave), OLD_LOCATION, NEW_LOCATION.
# Timeout: 10s by default (configurable via the "timeout" field).
#
# [locations.office.hooks]
#   [locations.office.hooks.on_enter]
#   exec = "/usr/local/bin/disconnect-vpn"
#
#   [locations.office.hooks.on_leave]
#   exec = "/usr/local/bin/connect-vpn"
#
# ── PAC-based location (example: proxy auto-config) ──────────────────────────
# Instead of a static proxy URL, a location can reference a PAC script
# (by name from [pacs], or by file path / URL).
# The PAC script is evaluated per-request (JavaScript, FindProxyForURL).
# Exactly one of proxy or pac must be set.
#
# [locations.pac-routed]
# pac = "corporate"
# ssids = ["OfficeWifi"]
#
# ── Home network example (add your own SSID) ──────────────────────────────────
# Routes can rewrite to any URL. Here, corporate artifact requests go
# directly to the company Nexus (bypassing any location proxy since routes
# always go direct to their target):
#
# [locations.home]
# proxy = "direct"
# ssids = ["MyHomeWiFi"]
#
# [locations.home.routes]
# "repo1.maven.org/maven2/com/companyname/" = "https://nexus.company.com/repository/private/"
