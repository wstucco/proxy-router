version = "1"
listen = "localhost:1337"

[proxies]
corp = "http://username:password@corp-proxy:8080"

[defaults]
proxy = "direct"
no_proxy = []

[locations.office]
proxy = "corp"
domain = "CORP"
ssids = ["OfficeWifi", "OfficeWifi-5G"]
ips = ["10.0.0.0/8"]
dns = ["10.0.0.1", "10.0.0.2"]
no_proxy = [".internal.corp.com", "192.168.0.0/24"]

# Routes rewrite the destination URL for matching requests.
# They work like a reverse proxy / API gateway: requests whose
# host+path starts with the route key are redirected to the route value.
#
# Route key: URL prefix (hostname or hostname/path)
# Route value: base URL to redirect matching requests to
#
# Examples:
#   "httpbin.org" = "https://localhost:4321"
#     → httpbin.org/anything → localhost:4321/anything
#
#   "repo1.maven.org/maven2/com/company/" = "https://nexus.internal/repo/"
#     → repo1.maven.org/maven2/com/company/foo/1.0/foo-1.0.pom
#       → nexus.internal/repo/foo/1.0/foo-1.0.pom
#
# HTTP: routes are applied directly (path is already visible).
# HTTPS: routes require TLS interception (MITM), enabled automatically
# when routes are defined on a location. The proxy-router CA cert must
# be trusted for HTTPS routes to work.
#
# Install the CA cert:
#   proxy-router install-certs
#   sudo security add-trusted-cert -d -r trustRoot \
#     -k /Library/Keychains/System.keychain /opt/homebrew/etc/proxy-router/cacert.pem
#
# Uncomment to use:
# [locations.office.routes]
# "httpbin.org" = "https://localhost:4321"
# "repo1.maven.org/maven2/com/company/" = "https://nexus.internal/repo/"
# "repo1.maven.org/maven2/com/other/" = "https://nexus.internal/other-repo/"

[locations.home-office]
proxy = "corp"
ssids = ["home-office"]

# Internal domains always go via upstream regardless of network
[locations.internal]
proxy = "corp"
domains = ["internal.corp.com", "jira.corp.com", "confluence.corp.com"]
