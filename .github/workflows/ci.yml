name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ─── build (matrix: darwin arm64, linux amd64) ─────────────────────────────
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME:-dev} -s -w" \
            -o proxy-router \
            ./cmd/proxy

      - name: Package
        run: |
          ARCHIVE="proxy-router-${GITHUB_REF_NAME:-dev}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "$ARCHIVE" proxy-router
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-router-${{ matrix.goos }}-${{ matrix.goarch }}
          path: proxy-router-*-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 7

  # ─── release ───────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: macos-15
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: proxy-router-*
          merge-multiple: true

      - name: Compute sha256 (macOS)
        id: sha256_darwin
        run: |
          ARCHIVE="proxy-router-${{ github.ref_name }}-darwin-arm64.tar.gz"
          SHA=$(shasum -a 256 "artifacts/$ARCHIVE" | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Prepare release body
        run: |
          VERSION="${{ github.ref_name }}"
          awk "/^## ${VERSION} /{p=1; next} /^## v[0-9]/{exit} p" CHANGELOG \
            | sed '/^$/N;/^\n$/d' > /tmp/changelog_body.txt
          printf '\n---\n\n' >> /tmp/changelog_body.txt
          printf '### Install via Homebrew (recommended)\n' >> /tmp/changelog_body.txt
          printf '```\n' >> /tmp/changelog_body.txt
          printf 'brew tap wstucco/tap\n' >> /tmp/changelog_body.txt
          printf 'brew install proxy-router\n' >> /tmp/changelog_body.txt
          printf 'brew services start proxy-router\n' >> /tmp/changelog_body.txt
          printf 'proxy-router install\n' >> /tmp/changelog_body.txt
          printf '```\n\n' >> /tmp/changelog_body.txt
          printf '### Manual install\n' >> /tmp/changelog_body.txt
          printf '#### macOS (ARM64)\n' >> /tmp/changelog_body.txt
          printf '```\n' >> /tmp/changelog_body.txt
          printf 'tar -xzf proxy-router-%s-darwin-arm64.tar.gz\n' "${VERSION}" >> /tmp/changelog_body.txt
          printf 'sudo mv proxy-router /usr/local/bin/proxy-router\n' >> /tmp/changelog_body.txt
          printf 'proxy-router install\n' >> /tmp/changelog_body.txt
          printf '```\n\n' >> /tmp/changelog_body.txt
          printf '#### Linux (AMD64)\n' >> /tmp/changelog_body.txt
          printf '```\n' >> /tmp/changelog_body.txt
          printf 'tar -xzf proxy-router-%s-linux-amd64.tar.gz\n' "${VERSION}" >> /tmp/changelog_body.txt
          printf 'sudo mv proxy-router /usr/local/bin/proxy-router\n' >> /tmp/changelog_body.txt
          printf 'proxy-router install\n' >> /tmp/changelog_body.txt
          printf '```\n' >> /tmp/changelog_body.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/changelog_body.txt
          files: artifacts/proxy-router-*.tar.gz

      - name: Update Homebrew formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ steps.sha256_darwin.outputs.sha256 }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/wstucco/homebrew-tap.git tap

          FORMULA="tap/Formula/proxy-router.rb"
          cp Formula/proxy-router.rb "$FORMULA"
          sed -i '' "s|version \".*\"|version \"${VERSION#v}\"|" "$FORMULA"
          sed -i '' "s|sha256 \".*\"|sha256 \"$SHA256\"|" "$FORMULA"

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/proxy-router.rb
          git commit -m "proxy-router: update to ${VERSION}"
          git push https://x-access-token:${TAP_TOKEN}@github.com/wstucco/homebrew-tap.git HEAD:main
